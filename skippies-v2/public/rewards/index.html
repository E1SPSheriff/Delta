<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mamashop Rewards</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3ECE0;--card:#FBF7F0;--ink:#1F3A2C;--mute:#5E6F63;--sage:#7A907C;--sageD:#4F6A55;--blush:#EBC6BD;--line:#DCD2C0;--on:#FBF7F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17211A;--card:#1F2C23;--ink:#EFE8DA;--mute:#A4B3A7;--sage:#8DA68F;--sageD:#A8C2AA;--blush:#8A5F58;--line:#2E3D32;--on:#17211A}}
:root[data-theme="dark"]{--bg:#17211A;--card:#1F2C23;--ink:#EFE8DA;--mute:#A4B3A7;--sage:#8DA68F;--sageD:#A8C2AA;--blush:#8A5F58;--line:#2E3D32;--on:#17211A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-family:"Young Serif",Georgia,serif;font-size:22px}
.brand svg{height:58px;width:auto;display:block;color:var(--ink)}.ico svg{width:100%;height:auto;display:block;border-radius:18%}.logobox{border-radius:20px;overflow:hidden;line-height:0}.logobox svg{width:100%;height:auto}.foot{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:28px;color:var(--mute);font-size:13px}.foot svg{width:36px;height:36px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:200px;border:0;background:none;color:var(--mute);font:700 14px Figtree,sans-serif;padding:10px;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--sage);color:var(--on)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sageD);outline-offset:2px}
.grid{display:grid;gap:16px}
@media(min-width:760px){.wrap{padding-bottom:40px}nav{position:static;border:0;background:none;padding:0;margin-bottom:22px;justify-content:flex-start}nav button{flex:none;padding:10px 22px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.hero{display:flex;gap:22px;align-items:center;background:var(--sage);color:var(--on);border:0;border-radius:28px;padding:24px}
.hero p{margin:4px 0 0}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"Young Serif",serif;font-size:30px;line-height:1}
.ring .n small{display:block;font:500 12px Figtree,sans-serif;margin-top:4px}
.stat{font-family:"Young Serif",serif;font-size:32px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pill{display:inline-block;background:var(--blush);color:var(--ink);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 14px;font:500 14px Figtree,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:8px 0 4px}
input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Figtree,sans-serif}
.f{display:flex;gap:10px}
.btn{border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:700 15px Figtree,sans-serif;padding:12px 18px;cursor:pointer}
.btn.alt{background:var(--blush);color:#1F3A2C}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tiers{display:flex;gap:8px;margin-top:12px}
.tiers div{flex:1;border-radius:14px;padding:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.tiers div.on{border-color:var(--sageD);background:var(--blush);color:#1F3A2C}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hidden{display:none}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<script>
var CATS=[["Lunchboxes",1,"On the Go","catalogue/lunchboxes"],["Reusable Straws",1,"On the Go","catalogue/reusable-straws"],["Reusable Cups",1,"On the Go","catalogue/reusable-cups"],["Reusable Bowls",1,"On the Go","catalogue/reusable-bowls"],["Reusable Utensils",1,"On the Go","catalogue/reusable-utensils"],["Local Collection",2,"Local Collection","catalogue"],["Kitchenware",1,"Homeware","catalogue/kitchenware"],["Tableware",1,"Homeware","catalogue/tableware"],["Drinkware",1,"Homeware","catalogue/drinkware"],["Combs",1,"Eco-Living","catalogue/combs"],["Furniture",1,"Eco-Living","catalogue/furniture"],["Disney Collection",1,"Disney","catalogue/disney-collection"],["Gifts",1,"Gifts","catalogue/gifts"],["Kids",1,"Kids","catalogue/kids"],["Premium",1.5,"Premium","catalogue/premium"],["Sale",0.5,"Sale","catalogue/sale"]];
var TIERS=[["Sprout",0,"Earn 1 point per $1 spent."],["Sapling",500,"Lower free shipping threshold."],["Evergreen",1500,"Early access to New Arrivals and Local Collection drops."]];
var REWARDS=[["Free shipping",150,"One order, any size",0],["Reusable straw set",300,"Pick one from On the Go",0],["$5 voucher",250,"Any full price item",0],["$10 voucher",450,"Any full price item",0],["Early access pass",200,"Shop the next drop first",2]];
var ARTICLES=["Why reusables beat single use","Meet the makers behind our Local Collection","How to pack a zero waste lunchbox"];
var S={pts:0,life:0,plastic:0,log:[],reads:{wk:"",ids:[]}},cart=[],selCat=0,view="home";
function wk(){var d=new Date(),t=new Date(d.getFullYear(),0,1);return d.getFullYear()+"-"+Math.floor((d-t)/604800000)}
try{var raw=localStorage.getItem("mamashop_rewards");if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem("mamashop_rewards",JSON.stringify(S))}catch(e){}}
function tierIdx(){var i=0;TIERS.forEach(function(t,k){if(S.life>=t[1])i=k});return i}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2600)}
function add(p,why){S.pts+=p;S.life+=Math.max(p,0);S.log.unshift({w:why,p:p,d:new Date().toLocaleDateString("en-SG",{day:"numeric",month:"short"})});S.log=S.log.slice(0,30);save()}
function calc(){var pts=0,cats={};cart.forEach(function(l){pts+=Math.floor(l.amt*CATS[l.c][1]);cats[CATS[l.c][2]]=1});var b=Object.keys(cats).length>=3?50:0;return{pts:pts,bonus:b}}
function ring(){var i=tierIdx(),nx=TIERS[i+1],pr=nx?(S.life-TIERS[i][1])/(nx[1]-TIERS[i][1]):1,C=2*Math.PI*54;
return '<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="54" fill="none" stroke="rgba(251,247,240,.3)" stroke-width="12"/><circle cx="66" cy="66" r="54" fill="none" stroke="#FBF7F0" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pr))+'"/></svg>'}
function home(){var i=tierIdx(),nx=TIERS[i+1];
var h='<section class="hero"><div class="ring">'+ring()+'<div class="n">'+S.pts+'<small>points</small></div></div><div><h1>'+TIERS[i][0]+'</h1><p>'+(nx?(nx[1]-S.life)+' more points to reach '+nx[0]+'.':'You are at our top tier.')+'</p></div></section>';
h+='<div class="grid two" style="margin-top:16px"><div class="card"><div class="mute">Plastic avoided</div><div class="stat">'+S.plastic+' items</div><p class="mute" style="margin:6px 0 0">Reusable straws, cups, bowls and lunchboxes you have bought.</p></div>';
h+='<div class="card"><div class="mute">Your perks</div><div class="stat">'+TIERS[i][0]+'</div><p class="mute" style="margin:6px 0 0">'+TIERS[i][2]+'</p></div></div>';
h+='<div class="card" style="margin-top:16px"><h3>Tiers</h3><div class="tiers">'+TIERS.map(function(t,k){return '<div class="'+(k===i?"on":"")+'"><b>'+t[0]+'</b><br>'+t[1]+'+ pts</div>'}).join("")+'</div></div>';
h+='<div class="card" style="margin-top:16px"><h3>Recent activity</h3>'+(S.log.length?S.log.slice(0,6).map(function(x){return '<div class="row"><span>'+x.w+'<br><span class="mute">'+x.d+'</span></span><b>'+(x.p>0?"+":"")+x.p+'</b></div>'}).join(""):'<p class="mute">Nothing yet. Log a purchase in Earn to get your first points.</p>')+'</div>';
h+='<div class="card" style="margin-top:16px;display:flex;gap:14px;align-items:center"><div class="ico" style="width:64px;flex:none">'+document.getElementById("a-ski").innerHTML+'</div><div style="flex:1"><h3>Skippies</h3><p class="mute" style="margin:2px 0 0">Our little game is on the way.</p></div><button class="btn alt" data-v="play">Open</button></div>';
return h}
function play(){return '<div class="logobox">'+document.getElementById("a-skl").innerHTML+'</div><div class="card" style="margin-top:16px;display:flex;gap:18px;align-items:center"><div class="ico" style="width:96px;flex:none">'+document.getElementById("a-ski").innerHTML+'</div><div><span class="pill">Coming soon</span><h3 style="margin-top:8px">Hop in soon</h3><p class="mute" style="margin:4px 0 0">Skippies is the Mamashop game. Play it to earn bonus points once it launches.</p></div></div>'}
function earn(){var c=calc();
var h='<div class="grid two"><div class="card"><h3>Log a purchase</h3><p class="mute">Pick a category, then add the amount you spent.</p><div class="chips" role="group" aria-label="Category">'+CATS.map(function(x,k){return '<button class="chip" data-c="'+k+'" aria-pressed="'+(k===selCat)+'">'+x[0]+' '+x[1]+'x</button>'}).join("")+'</div>';
h+='<p class="mute" style="margin:0 0 6px"><a href="https://mamashop.sg/'+CATS[selCat][3]+'" target="_blank" rel="noopener" style="color:var(--sageD)">Browse '+CATS[selCat][0]+' on Mamashop</a></p>';
h+='<div class="f"><div style="flex:1"><label for="amt">Amount ($)</label><input id="amt" type="number" min="1" step="0.01" inputmode="decimal" placeholder="25.00"></div><div style="flex:1"><label for="qty">Items</label><input id="qty" type="number" min="1" value="1" inputmode="numeric"></div></div>';
h+='<p style="margin:14px 0 0"><button class="btn" id="addLine">Add to purchase</button></p></div>';
h+='<div class="card"><h3>This purchase</h3>'+(cart.length?cart.map(function(l,k){return '<div class="row"><span>'+CATS[l.c][0]+' x'+l.q+'<br><span class="mute">$'+l.amt.toFixed(2)+'</span></span><button class="chip" data-rm="'+k+'" aria-label="Remove line">Remove</button></div>'}).join("")+'<div class="row"><span>Points from spend</span><b>'+c.pts+'</b></div><div class="row"><span>Bundle bonus <span class="mute">(3 different groups)</span></span><b>'+c.bonus+'</b></div><p style="margin:14px 0 0"><button class="btn" id="confirm">Confirm and earn '+(c.pts+c.bonus)+' pts</button></p>':'<p class="mute">Your purchase is empty. Add a line to see your points.</p>')+'</div></div>';
var cap=S.reads.wk===wk()?S.reads.ids.length:0;
h+='<div class="card" style="margin-top:16px"><h3>More ways to earn</h3><p class="mute">Journal reads: 5 points each, up to 3 a week ('+cap+' of 3 used).</p>'+ARTICLES.map(function(a,k){var done=S.reads.wk===wk()&&S.reads.ids.indexOf(k)>-1;return '<div class="row"><span>'+a+'</span><button class="chip" data-read="'+k+'"'+(done?' disabled':'')+'>'+(done?'Read':'Read +5')+'</button></div>'}).join("")+'<div class="row"><span>Refer a friend<br><span class="mute">100 points each after their first order</span></span><button class="chip" id="copyRef">Copy code</button></div></div>';
return h}
function rewards(){var i=tierIdx();
return '<div class="card"><h3>You have '+S.pts+' points</h3><p class="mute">Redeem for vouchers and perks. Codes work at checkout.</p></div><div class="grid two" style="margin-top:16px">'+REWARDS.map(function(r,k){var lock=i<r[3],low=S.pts<r[1];
return '<div class="card"><h3>'+r[0]+'</h3><p class="mute">'+r[2]+'</p><p><span class="pill">'+r[1]+' pts</span></p><button class="btn'+(lock||low?"":" alt")+'" data-redeem="'+k+'"'+(lock||low?' disabled':'')+'>'+(lock?'Evergreen only':low?(r[1]-S.pts)+' pts to go':'Redeem')+'</button></div>'}).join("")+'</div>'}
function render(){var a=document.getElementById("app");a.innerHTML=view==="home"?home():view==="earn"?earn():view==="play"?play():rewards();document.getElementById("tierPill").textContent=TIERS[tierIdx()][0]+" member";
document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===view)})}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.v){view=t.dataset.v;render();window.scrollTo(0,0);return}
if(t.dataset.c!==undefined){selCat=+t.dataset.c;render();return}
if(t.dataset.rm!==undefined){cart.splice(+t.dataset.rm,1);render();return}
if(t.id==="addLine"){var amt=parseFloat(document.getElementById("amt").value),q=parseInt(document.getElementById("qty").value,10)||1;if(!(amt>0)){toast("Enter an amount above $0");return}cart.push({c:selCat,amt:amt,q:q});render();return}
if(t.id==="confirm"){var c=calc();cart.forEach(function(l){if(CATS[l.c][2]==="On the Go")S.plastic+=l.q});add(c.pts,"Purchase ("+cart.length+" item line"+(cart.length>1?"s":"")+")");if(c.bonus)add(c.bonus,"Bundle bonus");cart=[];toast("You earned "+(c.pts+c.bonus)+" points");render();return}
if(t.dataset.read!==undefined){if(S.reads.wk!==wk())S.reads={wk:wk(),ids:[]};if(S.reads.ids.length>=3){toast("Weekly limit reached. Come back next week");return}S.reads.ids.push(+t.dataset.read);add(5,"Read: "+ARTICLES[+t.dataset.read]);toast("+5 points");render();return}
if(t.id==="copyRef"){var code="MAMA-EISTEN";try{navigator.clipboard.writeText(code)}catch(x){}toast("Code "+code+" copied");return}
if(t.dataset.redeem!==undefined){var r=REWARDS[+t.dataset.redeem];if(S.pts<r[1])return;var code="MAMA"+Math.random().toString(36).slice(2,7).toUpperCase();add(-r[1],"Redeemed "+r[0]);toast(r[0]+" code: "+code);render()}});
render();
</script>
</body>
</html>
